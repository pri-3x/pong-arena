{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "pong.labels" . | nindent 4 }}
spec:
  clusterIP: None             # headless: stable per-Pod DNS, no load balancing
  selector:
    app: {{ .Release.Name }}-postgres
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "pong.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: {{ .Release.Name }}-config, key: POSTGRES_USER }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: {{ .Release.Name }}-config, key: POSTGRES_DB }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{ name: postgres, containerPort: 5432 }]
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "{{ .Values.config.POSTGRES_USER }}"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
