# Local development only. This is NOT how we run in Kubernetes - it exists so
# you can start the backing services on your Mac with one command.
#
# Compose and Kubernetes solve overlapping problems, but Compose runs containers
# on ONE machine with no scheduling, self-healing, or scaling. Kubernetes is the
# thing we are actually learning; Compose is a convenience for local dev.
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"     # 6380 on the Mac -> 6379 in the container
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pong
      POSTGRES_PASSWORD: pong_dev_password
      POSTGRES_DB: pong
    ports:
      - "5433:5432"     # 5433 on the Mac - 5432 is taken by another project
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pong"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  # A named volume, unlike Redis above. Local dev data should survive
  # `docker compose down` - that is the whole point of a database.
  pgdata:
