apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1                  # exactly one. Two Redises would be two separate
                               # truths, which is the problem we are solving.
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""              # disable snapshotting to disk
            - --appendonly
            - "no"
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # emptyDir lives and dies with the Pod. That is DELIBERATE here: the
        # matchmaking queue is ephemeral - if Redis restarts, players simply
        # requeue. Real persistence (PersistentVolume) arrives in Phase 9 for
        # PostgreSQL, where losing data is not acceptable.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
