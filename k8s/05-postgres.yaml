apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            # Only the keys this container actually needs, pulled individually
            # rather than with envFrom. The ConfigMap also carries REDIS_HOST
            # and friends, which mean nothing to PostgreSQL.
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: pong-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: pong-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pong-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pong"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        # DELIBERATELY WRONG, for one phase only.
        #
        # emptyDir is scratch space tied to the Pod's lifetime. When this Pod is
        # replaced, every user account disappears. We are going to prove that,
        # because "databases need persistent storage" lands better as a
        # demonstration than as a warning. Phase 9 replaces this with a
        # PersistentVolumeClaim and a StatefulSet.
        - name: data
          emptyDir: {}
