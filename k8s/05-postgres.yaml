# A HEADLESS Service: clusterIP: None.
#
# A normal Service gives you one virtual IP that load-balances across Pods -
# exactly what you do NOT want for a database, where every replica is a
# different thing. A headless Service instead gives each Pod its own DNS record:
#
#     postgres-0.postgres.default.svc.cluster.local
#
# That stable per-Pod name is what makes a StatefulSet useful. The plain name
# `postgres` still resolves (to the Pod addresses), so the application's
# connection settings do not change.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres        # must name the headless Service above
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Give PostgreSQL time to finish a clean shutdown. The default 30s is
      # usually enough here, but a database being SIGKILLed mid-write is
      # exactly the situation worth avoiding.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: pong-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: pong-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pong-secrets
                  key: POSTGRES_PASSWORD
            # PGDATA points at a SUBDIRECTORY of the mount, not the mount root.
            # Some volume types put a lost+found directory at the root, and
            # PostgreSQL refuses to initialise into a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            # Databases are given requests == limits (QoS class Guaranteed) so
            # they are the LAST thing evicted when the node is under pressure.
            # Everything else here is Burstable and will be sacrificed first.
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 250m, memory: 512Mi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pong"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # The StatefulSet's defining feature: each replica gets its OWN PVC, created
  # from this template and named data-postgres-0, data-postgres-1, ... The claim
  # follows its Pod across restarts and rescheduling.
  #
  # These PVCs are deliberately NOT deleted when the StatefulSet is deleted.
  # Kubernetes assumes your data is more valuable than your tidiness.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
