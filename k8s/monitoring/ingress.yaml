# Expose Grafana at http://localhost/grafana so the dashboard is reachable
# without a port-forward. Prometheus is deliberately NOT exposed - it has no
# authentication at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service: { name: grafana, port: { number: 3000 } }
