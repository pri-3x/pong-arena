apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
spec:
  replicas: 2                  # DESIRED state: always keep 2 Pods alive
  strategy:
    type: RollingUpdate        # replace Pods gradually, never all at once
    rollingUpdate:
      maxSurge: 1              # may temporarily run 1 EXTRA Pod (so: up to 3)
      maxUnavailable: 0        # never drop below 2 ready Pods -> zero downtime
  selector:
    matchLabels:
      app: game-server         # which Pods this Deployment considers "mine"
  template:                    # <-- everything below is the Pod blueprint
    metadata:
      labels:
        app: game-server       # must match the selector above
      annotations:
        # Opt in to Prometheus scraping. The config keeps only pods carrying
        # this, so nothing is scraped by accident.
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: game-server
          image: pong-game-server:v15
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # Non-sensitive settings come from the ConfigMap, the two secrets from
          # the Secret. `envFrom` injects every key in each as an environment
          # variable, so adding config later means editing one ConfigMap rather
          # than every Deployment that needs it.
          envFrom:
            - configMapRef:
                name: pong-config
            - secretRef:
                name: pong-secrets
          env:
            - name: APP_VERSION
              value: "v15"
            # The downward API: a fact about the Pod itself, not configuration,
            # so it stays here rather than in the ConfigMap.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Enables POST /debug/unready so probe behaviour can be demonstrated.
            # Never set this outside a learning cluster.
            - name: ALLOW_CHAOS
              value: "true"

          resources:
            # REQUESTS are what the scheduler reserves. The sum of all requests
            # on a node cannot exceed its capacity, so this is what decides
            # whether a Pod fits. It is also the baseline the HPA measures
            # against in Phase 13 - without a CPU request there is no
            # "percentage of CPU" to autoscale on.
            requests:
              cpu: 100m          # 0.1 of a core
              memory: 128Mi
            # LIMITS are a hard ceiling, and the two resources behave very
            # differently at the ceiling:
            #   CPU    is compressible -> the container is THROTTLED
            #   memory is not          -> the container is OOMKilled
            limits:
              cpu: 500m
              memory: 256Mi

          # STARTUP probe: "has the process finished booting?"
          # While this is running, the liveness and readiness probes are held
          # off entirely. It exists so a slow start (migrations, warm-up) is not
          # mistaken for a hang and restarted in a loop.
          startupProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 2
            failureThreshold: 30        # allow up to 60s to boot

          # LIVENESS: "is this process alive?"
          # Deliberately checks NOTHING external. If it checked Postgres, a
          # database blip would restart every healthy game server and turn a
          # small outage into a large one.
          # Failing this RESTARTS the container.
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # READINESS: "can this process serve traffic?"
          # This one DOES check dependencies, because the right response to a
          # broken dependency is to stop receiving traffic, not to be killed.
          # Failing this removes the Pod from the Service's endpoints.
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
