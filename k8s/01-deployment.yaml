apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
spec:
  replicas: 2                  # DESIRED state: always keep 2 Pods alive
  strategy:
    type: RollingUpdate        # replace Pods gradually, never all at once
    rollingUpdate:
      maxSurge: 1              # may temporarily run 1 EXTRA Pod (so: up to 3)
      maxUnavailable: 0        # never drop below 2 ready Pods -> zero downtime
  selector:
    matchLabels:
      app: game-server         # which Pods this Deployment considers "mine"
  template:                    # <-- everything below is the Pod blueprint
    metadata:
      labels:
        app: game-server       # must match the selector above
    spec:
      containers:
        - name: game-server
          image: pong-game-server:v7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              value: "v7"
            # Service discovery by NAME, never by IP. CoreDNS resolves this to
            # whatever Pod the redis Service currently points at.
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            # The "downward API": Kubernetes injects facts about the Pod itself
            # into the container. We use the real Pod name as this process's
            # address on the Redis message bus.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "pong"
            - name: POSTGRES_DB
              value: "pong"
            # TODO(phase 8): these two are secrets and must move to a
            # Kubernetes Secret rather than sitting in a committed manifest.
            - name: POSTGRES_PASSWORD
              value: "pong_dev_password"
            - name: JWT_SECRET
              value: "dev-only-insecure-secret-change-me"
