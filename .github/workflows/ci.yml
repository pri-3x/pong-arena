name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      # Real dependencies, not mocks. The integration tests genuinely need a
      # Redis and a PostgreSQL to talk to.
      redis:
        image: redis:7.4-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pong
          POSTGRES_PASSWORD: pong_ci_password
          POSTGRES_DB: pong
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            services/game-server/package-lock.json
            services/web/package-lock.json

      - name: Install game-server
        working-directory: services/game-server
        run: npm ci

      - name: Typecheck and build game-server
        working-directory: services/game-server
        run: npm run build

      - name: Physics tests
        working-directory: services/game-server
        run: node test/physics.test.mjs

      - name: Start two instances sharing one Redis
        working-directory: services/game-server
        env:
          REDIS_PORT: 6380
          POSTGRES_PORT: 5433
          POSTGRES_PASSWORD: pong_ci_password
          JWT_SECRET: ci-only-secret
        run: |
          POD_NAME=pod-A PORT=3101 node dist/index.js > /tmp/a.log 2>&1 &
          POD_NAME=pod-B PORT=3102 node dist/index.js > /tmp/b.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf localhost:3101/ready >/dev/null 2>&1 && \
            curl -sf localhost:3102/ready >/dev/null 2>&1 && break
            sleep 1
          done
          curl -s localhost:3101/ready

      - name: Auth tests
        working-directory: services/game-server
        run: node test/auth.test.mjs http://localhost:3101

      - name: Cross-replica matchmaking tests
        working-directory: services/game-server
        run: node test/redis.test.mjs http://localhost:3101 http://localhost:3102

      - name: Match history tests
        working-directory: services/game-server
        env: { U1: ci_ada, U2: ci_grace }
        run: |
          for u in ci_ada:lovelace-1815 ci_grace:hopper-1906; do
            curl -s -o /dev/null -X POST localhost:3101/auth/register \
              -H 'content-type: application/json' \
              -d "{\"username\":\"${u%%:*}\",\"password\":\"${u##*:}\"}"
          done
          node test/history.test.mjs http://localhost:3101 http://localhost:3102

      - name: Dump server logs on failure
        if: failure()
        run: tail -50 /tmp/a.log /tmp/b.log

      - name: Build and typecheck web
        working-directory: services/web
        run: npm ci && npm run build

  images:
    name: Build and push images
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GitHub Container Registry
    strategy:
      matrix:
        include:
          - name: game-server
            context: services/game-server
          - name: web
            context: services/web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is injected by Actions and scoped to this repository.
          # No long-lived registry credential is stored anywhere.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Tag with the commit SHA, never only :latest. A mutable tag makes it
          # impossible to know what is actually running, and breaks rollback.
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
